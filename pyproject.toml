[project]
name = "koti-backend"
version = "0.1.0"
description = "Signal Next.js + FastAPI application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "resend>=0.7.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "aiosqlite>=0.22.1",
    "cloudinary>=1.40.0",
]
