<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Admin</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
            --error-color: #cf6679;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1, h2 { color: var(--primary-color); }
        .card {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #2c2c2c;
            color: white;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .hidden { display: none; }
        .nav-tabs button {
            width: auto;
            margin-right: 10px;
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        .nav-tabs button.active {
            background-color: var(--primary-color);
            color: #000;
        }
        .logout-btn {
            width: auto;
            background-color: var(--error-color);
            color: #fff;
        }
        .error-msg {
            color: var(--error-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Signal Admin Panel</h1>
            <div id="auth-header" class="hidden">
                <span id="user-email"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="login-section" class="card">
            <h2>Login</h2>
            <div id="login-error" class="error-msg"></div>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="nav-tabs">
                <button class="active" onclick="showTab('projects')">Projects</button>
                <button onclick="showTab('services')">Services</button>
            </div>

            <div id="projects-tab" class="tab-content card">
                <h2>Manage Projects</h2>
                <form id="project-form">
                    <input type="text" id="proj-title" placeholder="Project Title" required>
                    <textarea id="proj-desc" placeholder="Description"></textarea>
                    <input type="file" id="proj-image" accept="image/*">
                    <button type="submit">Add Project</button>
                </form>
                <div id="projects-list">
                    <!-- Project table will be loaded here -->
                </div>
            </div>

            <div id="services-tab" class="tab-content card hidden">
                <h2>Manage Services</h2>
                <form id="service-form">
                    <input type="text" id="srv-title" placeholder="Service Title" required>
                    <textarea id="srv-desc" placeholder="Description"></textarea>
                    <button type="submit">Add Service</button>
                </form>
                <div id="services-list">
                    <!-- Services table will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        // Auth Logic
        function getToken() { return localStorage.getItem('admin_token'); }
        function setToken(token) { localStorage.setItem('admin_token', token); }
        function logout() {
            localStorage.removeItem('admin_token');
            checkAuth();
        }

        async function apiCall(endpoint, options = {}) {
            const token = getToken();
            const headers = options.headers || {};
            if (token && !(options.body instanceof FormData)) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            if (!(options.body instanceof FormData) && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }
            if (options.body instanceof FormData && token) {
                 headers['Authorization'] = `Bearer ${token}`;
            }

            const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            if (res.status === 401 || res.status === 403) {
                logout();
                throw new Error('Unauthorized');
            }
            if (!res.ok) throw new Error('API Error');
            return res.status !== 204 ? await res.json() : null;
        }

        async function checkAuth() {
            const token = getToken();
            if (token) {
                try {
                    const user = await apiCall('/auth/me');
                    if (user.is_admin) {
                        document.getElementById('login-section').classList.add('hidden');
                        document.getElementById('dashboard-section').classList.remove('hidden');
                        document.getElementById('auth-header').classList.remove('hidden');
                        document.getElementById('user-email').innerText = user.email;
                        loadProjects();
                    } else {
                        throw new Error('Not an admin');
                    }
                } catch (e) {
                    logout();
                }
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('auth-header').classList.add('hidden');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                if (!res.ok) throw new Error('Invalid credentials');
                const data = await res.json();
                setToken(data.access_token);
                checkAuth();
            } catch (e) {
                document.getElementById('login-error').innerText = 'Login failed.';
            }
        });

        // Tabs
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById(`${tabId}-tab`).classList.remove('hidden');
            event.target.classList.add('active');
            
            if (tabId === 'projects') loadProjects();
            if (tabId === 'services') loadServices();
        }

        // Projects
        async function loadProjects() {
            const projects = await apiCall('/projects');
            let html = '<table><tr><th>Title</th><th>Image</th><th>Action</th></tr>';
            projects.forEach(p => {
                html += `<tr>
                    <td>${p.title}</td>
                    <td>${p.image_url ? '<img src="'+p.image_url+'" height="50">' : 'No Image'}</td>
                    <td><button onclick="deleteProject('${p.id}')">Delete</button></td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('projects-list').innerHTML = html;
        }

        document.getElementById('project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('proj-title').value);
            formData.append('description', document.getElementById('proj-desc').value);
            const image = document.getElementById('proj-image').files[0];
            if (image) formData.append('image', image);

            await apiCall('/admin/projects', { method: 'POST', body: formData });
            e.target.reset();
            loadProjects();
        });

        async function deleteProject(id) {
            if (confirm('Delete project?')) {
                await apiCall(`/admin/projects/${id}`, { method: 'DELETE' });
                loadProjects();
            }
        }

        // Services
        async function loadServices() {
            const services = await apiCall('/services/all');
            let html = '<table><tr><th>Title</th><th>Action</th></tr>';
            services.forEach(s => {
                html += `<tr>
                    <td>${s.title}</td>
                    <td><button onclick="deleteService('${s.id}')">Delete</button></td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('services-list').innerHTML = html;
        }

        document.getElementById('service-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await apiCall('/admin/services', {
                method: 'POST',
                body: JSON.stringify({
                    title: document.getElementById('srv-title').value,
                    description: document.getElementById('srv-desc').value,
                    order_index: 0
                })
            });
            e.target.reset();
            loadServices();
        });

        async function deleteService(id) {
            if (confirm('Delete service?')) {
                await apiCall(`/admin/services/${id}`, { method: 'DELETE' });
                loadServices();
            }
        }

        checkAuth();
    </script>
</body>
</html>
